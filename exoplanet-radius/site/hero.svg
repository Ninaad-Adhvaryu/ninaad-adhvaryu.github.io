<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylised exoplanet transit — a star with a planet silhouetted in front, and the characteristic dip in the brightness curve below">
  <defs>
    <style>
      .bg          { fill: #F7F3EE; }
      .star        { fill: url(#star-grad); }
      .planet      { fill: #1A1714; }
      .axis        { stroke: #6B6460; stroke-width: 1.4; fill: none; }
      .ticks       { stroke: #6B6460; stroke-width: 0.9; }
      .grid        { stroke: #1A1714; stroke-width: 0.4; opacity: 0.07; fill: none; }
      .curve       { stroke: #1A4F4F; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .curve-pre   { stroke: #1A4F4F; stroke-width: 2.6; fill: none; stroke-linecap: round; opacity: 0.35; stroke-dasharray: 4 5; }
      .ingress     { stroke: #2A6B6B; stroke-width: 1.2; stroke-dasharray: 5 5; fill: none; }
      .baseline    { stroke: #B8B0A6; stroke-width: 1; stroke-dasharray: 2 6; fill: none; }
      .label       { fill: #6B6460; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
      .label-sm    { fill: #6B6460; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.10em; }
      .label-eq    { fill: #1A4F4F; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 0.05em; }
      .planet-trail{ stroke: #6B6460; stroke-width: 1; stroke-dasharray: 3 4; fill: none; opacity: 0.5; }
    </style>

    <!-- Star radial gradient: warm centre fading to cooler ring -->
    <radialGradient id="star-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FDFBF8"/>
      <stop offset="55%" stop-color="#E8E2D9"/>
      <stop offset="92%" stop-color="#C9D8DA"/>
      <stop offset="100%" stop-color="#B8CDCD"/>
    </radialGradient>

    <pattern id="curve-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 40 0 L 0 0 0 40"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="675"/>

  <!-- ─────────────────────────────────────────────────────────────
       TOP PANE — Star + Transiting Planet
       Centred at (600, 220), star radius 130
       ───────────────────────────────────────────────────────────── -->

  <!-- Subtle light corridor showing transit chord -->
  <line class="planet-trail" x1="370" y1="220" x2="830" y2="220"/>

  <!-- Star -->
  <circle class="star" cx="600" cy="220" r="130"/>
  <circle cx="600" cy="220" r="130" fill="none" stroke="#1A4F4F" stroke-width="0.8" opacity="0.25"/>

  <!-- Planet silhouetted mid-transit, slightly off-centre -->
  <circle class="planet" cx="560" cy="220" r="22"/>

  <!-- Planet earlier positions (ghosts, dashed) for trajectory hint -->
  <circle cx="450" cy="220" r="22" fill="none" stroke="#6B6460" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.4"/>
  <circle cx="670" cy="220" r="22" fill="none" stroke="#6B6460" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Labels -->
  <text class="label-sm" x="600" y="65" text-anchor="middle">HOST STAR · R*</text>
  <text class="label-sm" x="560" y="195" text-anchor="middle">R_p</text>

  <!-- ─────────────────────────────────────────────────────────────
       BOTTOM PANE — Light Curve with Transit Dip
       Plot area: x = 200..1000, y = 410..580
       Baseline flux at y = 430, dip floor at y = 510
       ───────────────────────────────────────────────────────────── -->

  <!-- Faint grid for the plot area -->
  <rect x="200" y="410" width="800" height="170" fill="url(#curve-grid)"/>

  <!-- Axes (loosely Tufte) -->
  <line class="axis" x1="200" y1="580" x2="1000" y2="580"/>
  <line class="axis" x1="200" y1="410" x2="200"  y2="580"/>

  <!-- Y-axis ticks: baseline flux and dip floor -->
  <line class="ticks" x1="195" y1="430" x2="205" y2="430"/>
  <line class="ticks" x1="195" y1="510" x2="205" y2="510"/>
  <text class="label-sm" x="190" y="434" text-anchor="end">1.000</text>
  <text class="label-sm" x="190" y="514" text-anchor="end">1 − (R_p/R*)²</text>

  <!-- Baseline (1.0) reference line, faint dashed -->
  <line class="baseline" x1="200" y1="430" x2="1000" y2="430"/>

  <!-- Ingress / egress markers -->
  <line class="ingress" x1="450" y1="410" x2="450" y2="580"/>
  <line class="ingress" x1="750" y1="410" x2="750" y2="580"/>
  <text class="label-sm" x="450" y="600" text-anchor="middle">ingress</text>
  <text class="label-sm" x="750" y="600" text-anchor="middle">egress</text>

  <!-- Transit dip light curve.
       Trapezoidal-with-rounded-corners shape:
       - Flat at y=430 from x=200 to x=440
       - Ingress curve descending into x=470, y=510
       - Flat floor from x=470 to x=730
       - Egress curve ascending from x=730 to x=760, y=430
       - Flat at y=430 from x=760 to x=1000
       Drawn as a single smooth path with quadratic ingress/egress edges. -->
  <path class="curve" d="
    M 200,430
    L 440,430
    Q 450,430 460,460
    Q 470,510 480,510
    L 720,510
    Q 730,510 740,460
    Q 750,430 760,430
    L 1000,430"/>

  <!-- X-axis label -->
  <text class="label-sm" x="600" y="625" text-anchor="middle">time</text>
  <text class="label-sm" x="195" y="400" text-anchor="end">flux</text>

  <!-- Transit-depth annotation -->
  <line class="ingress" x1="1020" y1="430" x2="1020" y2="510" opacity="0.7"/>
  <line class="ticks" x1="1015" y1="430" x2="1025" y2="430"/>
  <line class="ticks" x1="1015" y1="510" x2="1025" y2="510"/>
  <text class="label-eq" x="1035" y="473">Δ = (R_p / R*)²</text>

  <!-- Top corner label: catalogue / detection -->
  <text class="label" x="40" y="50">catalogue radius · R² = 0.765</text>
  <text class="label-sm" x="40" y="72">17,781 confirmed planets · nasa exoplanet archive</text>

</svg>
